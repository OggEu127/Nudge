[package]
name = "launcher-gui"
description = "Native egui desktop frontend for Nudge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "nudge-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
eframe.workspace = true
launcher-core.workspace = true
launcher-minecraft.workspace = true
launcher-modpack.workspace = true
launcher-net.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# A safe native startup-error dialog remains available when the release GUI
# intentionally has no console. No GTK/portal runtime is introduced on Linux.
rfd = { version = "0.17.2", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
