name: Windows portable build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Builds keep read-only permissions. Only the tag-triggered publishing job can
# create a Release; manual runs never publish or create/push tags.
permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile default --component rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --locked --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Build release binaries
        run: cargo build --locked --release -p launcher-cli -p launcher-gui --target x86_64-pc-windows-msvc

      - name: Smoke-test the packaged CLI
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = 'target/x86_64-pc-windows-msvc/release/nudge.exe'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI version check failed' }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help check failed' }
          $smokeRoot = Join-Path $env:RUNNER_TEMP "nudge-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $binary --config (Join-Path $smokeRoot 'config.json') --data-dir (Join-Path $smokeRoot 'data') config init
          if ($LASTEXITCODE -ne 0) { throw 'CLI configuration check failed' }

      - name: Package portable binaries and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $metadataText = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Cargo metadata' }
          $metadata = $metadataText | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -EQ 'launcher-cli').version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') { throw 'Invalid package version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and Cargo package versions differ' }
          $packageName = "Nudge-$version-windows-x86_64"
          $stagingRoot = Join-Path $env:RUNNER_TEMP "nudge-package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $packageRoot = Join-Path $stagingRoot $packageName
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          Copy-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/nudge.exe' -Destination $packageRoot
          Copy-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/nudge-gui.exe' -Destination $packageRoot
          Copy-Item -LiteralPath 'LICENSE', 'README.md' -Destination $packageRoot
          Copy-Item -LiteralPath 'docs', 'assets' -Destination $packageRoot -Recurse
          $buildInfo = [ordered]@{
            version = $version
            commit = $env:GITHUB_SHA
            target = 'x86_64-pc-windows-msvc'
            rustc = (rustc --version)
            source = "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA"
            workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          $buildInfo | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $packageRoot 'BUILD-INFO.json') -Encoding utf8
          $checksums = foreach ($name in 'nudge.exe', 'nudge-gui.exe') {
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $packageRoot $name)).Hash.ToLowerInvariant()
            "$digest  $name"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $packageRoot 'SHA256SUMS') -Encoding ascii
          New-Item -ItemType Directory -Path 'target/portable' | Out-Null
          $archive = Join-Path 'target/portable' "$packageName.zip"
          Compress-Archive -LiteralPath $packageRoot -DestinationPath $archive -CompressionLevel Optimal
          $archiveDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$archiveDigest  $packageName.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Upload portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nudge-windows-x86_64-${{ github.sha }}
          path: |
            target/portable/*.zip
            target/portable/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    name: Publish Windows release
    needs: windows-x64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download this run's Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Nudge-windows-x86_64-${{ github.sha }}
          path: target/portable
          digest-mismatch: error

      - name: Verify release files
        working-directory: target/portable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Invalid release tag' >&2
            exit 1
          fi
          archive="Nudge-${RELEASE_TAG#v}-windows-x86_64.zip"
          test -s "$archive"
          test -s "$archive.sha256"
          # Match exactly this ZIP, not another file named in the checksum file.
          expected="$(sha256sum -- "$archive")"
          actual="$(tr -d '\r' < "$archive.sha256")"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Release ZIP checksum or filename does not match' >&2
            exit 1
          fi
          sha256sum --check --strict "$archive.sha256"

      - name: Publish package and checksum
        working-directory: target/portable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="Nudge-${RELEASE_TAG#v}-windows-x86_64.zip"
          printf '%s\n' \
            'Windows 64 位便携版。下载 ZIP，解压后运行 nudge-gui.exe。' \
            '' \
            '附 SHA-256 校验文件。游戏需要自行安装对应版本的 Java。' \
            '这是未签名的开发版，仍需 Windows 桌面和真实游戏验收。' \
            '' \
            "源码：https://github.com/$GH_REPO/tree/$SOURCE_COMMIT" \
            > release-notes.md
          # Do not create missing tags or replace an existing Release/assets.
          # A failed upload leaves an unpublished draft for manual inspection.
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --verify-tag --draft --prerelease --latest=false \
            --title "Nudge $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
